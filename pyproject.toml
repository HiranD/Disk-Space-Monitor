[project]
name = "disk-space-monitor"
version = "0.1.0"
description = "Disk Space Monitor - Windows widget with Discord alerts and on-screen notifications"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.1.0",
    "psutil>=7.2.1",
    "pystray>=0.19.5",
    "requests>=2.32.5",
]

[project.scripts]
disk-space-monitor = "space_monitor:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.17.0",
]
